<!doctype html>
<html lang="en">
  <head>
    <title>Emoji Picker Demo</title>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Try a lightweight emoji picker. Type a shortcode and choose an emoji."
    />
    <style>
      html {
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8f6f4;
        color: #292524;
        font-family: system-ui, sans-serif;
      }
      .container {
        box-sizing: border-box;
        max-width: 720px;
        margin: 0 auto;
        padding: 72px 24px;
      }
      .intro {
        text-align: center;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-size: 3rem;
        letter-spacing: -0.05em;
      }
      .subtitle {
        margin: 12px 0 0;
        color: #57534e;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      .demo {
        padding: 32px;
        background: #fff;
      }
      .input-label {
        display: block;
        margin-bottom: 10px;
        font-size: 0.95rem;
        font-weight: 650;
      }
      .input {
        box-sizing: border-box;
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #a8a29e;
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-size: 1.15rem;
      }
      .input:focus {
        border-color: hotpink;
        outline: none;
      }
      .picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .emoji {
        display: flex;
        flex: 0 0 48px;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 2px solid #a8a29e;
        border-radius: 6px;
        background: #fff;
        font-size: 1.5rem;
        cursor: pointer;
      }
      .input,
      .emoji {
        font-family: "segoe ui emoji", sans-serif;
      }
      .emoji:hover {
        border-color: hotpink;
      }
      .emoji[aria-selected="true"],
      .emoji:focus-visible {
        border-color: hotpink;
        background: #fff0f7;
      }
      .hint {
        margin: 14px 0 0;
        color: #57534e;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .keyboard-hint {
        margin: 20px 0 0;
        color: #57534e;
        font-size: 0.85rem;
        text-align: center;
      }
      .site-footer {
        margin-top: 48px;
        color: #57534e;
        font-size: 0.9rem;
        text-align: center;
      }
      .site-footer a {
        color: inherit;
        text-decoration-color: hotpink;
        text-underline-offset: 3px;
      }
      kbd {
        padding: 2px 6px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #292524;
        font: inherit;
        font-size: 0.8em;
      }
      @media (max-width: 480px) {
        .container {
          padding: 48px 20px;
        }
        h1 {
          font-size: 2.25rem;
        }
        .demo {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="intro">
        <h1>Emoji Picker</h1>
        <p class="subtitle">Find the right emoji by typing a shortcode.</p>
      </header>
      <section class="demo" aria-label="Emoji picker demo">
        <label class="input-label" for="emoji-input">Try the picker</label>
        <input
          id="emoji-input"
          type="text"
          class="input"
          aria-describedby="input-hint"
          autocomplete="off"
        />
        <p id="input-hint" class="hint">
          Type a colon and a few letters, eg: <code>:dog</code>, then choose a
          suggestion.
        </p>
      </section>
      <p class="keyboard-hint">
        Start with <kbd>↓</kbd>, move with <kbd>←</kbd> <kbd>→</kbd>, select
        with <kbd>Enter</kbd>, clear with <kbd>↑</kbd>, or close with
        <kbd>Esc</kbd>.
      </p>
      <footer class="site-footer">
        <a href="https://github.com/rickycodes/emoji-picker"
          >View the project on GitHub</a
        >
        <span aria-hidden="true"> · </span>
        <a href="https://github.com/rickycodes/emoji-picker/releases"
          >Releases</a
        >
      </footer>
    </main>
  </body>
  <script type="module">
    import picker from "./src/index.js";
    import fetchJSON from "./src/fetchJSON.js";
    fetchJSON("./src/emoji.json")
      .then((emoji) => picker(".input", emoji))
      .catch((error) => {
        console.error(error);
      });
  </script>
</html>
